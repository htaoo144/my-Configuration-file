theme = "catppuccin_mocha"

[editor]
line-number = "relative"
mouse = true
cursorline = true
cursorcolumn = false
bufferline = "multiple"
true-color = true
color-modes = true
auto-completion = true
completion-replace = true
end-of-line-diagnostics = "hint"
auto-pairs = true

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.auto-save]
focus-lost = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "block"

[editor.statusline]
left = ["mode", "spinner"]
center = ["file-name"]
right = [
  "diagnostics",
  "selections",
  "position",
  "file-encoding",
  "file-line-ending",
  "file-type",
  "spinner",
]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.inline-diagnostics]
cursor-line = "warning"  # show warnings and errors on the cursorline inline
other-lines = "warning"
