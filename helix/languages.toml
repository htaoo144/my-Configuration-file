[language-server.gopls.config]
"ui.diagnostic.staticcheck" = true


[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[[language]]
name = "javascript"
language-servers = [
  "biome",
  { name = "typescript-language-server", except-features = [
    "format",
  ] },
]
auto-format = true
formatter = { command = "biome", args = [
  "check",
  "--write",
  "--stdin-file-path",
  "%{buffer_name}",
] }

[[language]]
name = "typescript"
language-servers = [
  "biome",
  { name = "typescript-language-server", except-features = [
    "format",
  ] },
]
auto-format = true
formatter = { command = "biome", args = [
  "check",
  "--write",
  "--stdin-file-path",
  "%{buffer_name}",
] }

[[language]]
name = "tsx"
auto-format = true
language-servers = [
  "biome",
  { name = "typescript-language-server", except-features = [
    "format",
  ] },
  "tailwindcss-ls",
]
formatter = { command = "biome", args = [
  "check",
  "--write",
  "--stdin-file-path",
  "%{buffer_name}",
] }

[[language]]
name = "jsx"
auto-format = true
language-servers = [
  "biome",
  { name = "typescript-language-server", except-features = [
    "format",
  ] },
  "tailwindcss-ls",
]
formatter = { command = "biome", args = [
  "check",
  "--write",
  "--stdin-file-path",
  "%{buffer_name}",
] }

[[language]]
name = "json"
language-servers = [
  "biome",
  { name = "vscode-json-language-server", except-features = [
    "format",
  ] },
]
auto-format = true
formatter = { command = "biome", args = [
  "check",
  "--write",
  "--stdin-file-path",
  "%{buffer_name}",
] }

[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "tailwindcss-ls"]

[[language]]
name = "css"
scope = "source.css"
file-types = ["css", "postcss"]
language-servers = [
  { name = "vscode-css-language-server", except-features = [
    "diagnostics",
  ] },
  "tailwindcss-ls",
]

[[language]]
name = "rust"
scope = "source.rust"
injection-regex = "rust"
file-types = ["rs"]
roots = [
    "Cargo.toml",
    "Cargo.lock",
]
auto-format = true
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = ["rust-analyzer"]
formatter = { command = "rustfmt", args = ["--edition", "2021"] }

indent = {tab-width = 4,unit = "    "}

[language-server.rust-analyzer.config]
check.command = "clippy"
check.workspace = true
procMacro.enable = true
cargo.buildScripts.enable = true

# inlay hints: RustRover-style
inlayHints.typeHints.enable = true
inlayHints.parameterHints.enable = true
inlayHints.chainingHints.enable = true
inlayHints.expressionAdjustmentHints.enable = "never"
inlayHints.closingBraceHints.enable = false

# imports: merge into crate-level groups like RustRover
imports.granularity.group = "crate"

# completion: postfix + autoimport like RustRover
completion.postfix.enable = true
completion.autoimport.enable = true

typing.autoClosingAngleBrackets.enable = true

# code lens: run/debug buttons and usage counts
lens.enable = true

[[language]]
name = "toml"
language-servers = ["tombi"]
auto-format = true
formatter = { command = "tombi", args = ["format", "-"] }

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
auto-format = true
formatter = { command = "yamlfmt", args = ["-"] }
